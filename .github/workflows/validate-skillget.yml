name: Validate skill catalogue

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate catalogue and skill folders
        run: python tools/validate_manifest.py

      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema==4.23.0"

      - name: Validate registry against JSON Schema
        run: >-
          python -c "import json;
          from pathlib import Path;
          from jsonschema import Draft202012Validator, FormatChecker;
          checker=FormatChecker();
          skill_schema=json.loads(Path('schemas/skills.schema.json').read_text());
          manifest=json.loads(Path('skills.json').read_text());
          Draft202012Validator(skill_schema, format_checker=checker).validate(manifest);
          source_schema=json.loads(Path('schemas/sources.schema.json').read_text());
          sources=json.loads(Path('skill-sources.json').read_text());
          Draft202012Validator(source_schema, format_checker=checker).validate(sources);
          print('JSON Schema validation passed')"

      - name: Check generated Markdown catalogue
        run: python tools/render_readme.py --check

      - name: Compile Python sources
        run: >-
          python -c "from pathlib import Path;
          files=sorted(Path('.').rglob('*.py'));
          [compile(path.read_text(encoding='utf-8'), str(path), 'exec') for path in files];
          print(f'Compiled {len(files)} Python files')"
